---
- name: Install Tomcat in Docker container
  hosts: target
  become: true

  vars:
    tomcat_version: "10.1.48"
    tomcat_user: tomcat
    tomcat_dir: /opt/tomcat

  tasks:

    - name: Install Java
      ansible.builtin.dnf:
        name: java-17-openjdk-devel
        state: present
        update_cache: true

    - name: Create Tomcat user
      ansible.builtin.user:
        name: "{{ tomcat_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create Tomcat directory
      ansible.builtin.file:
        path: "{{ tomcat_dir }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_user }}"
        mode: "0755"

    - name: Download Tomcat
      ansible.builtin.get_url:
        url: "https://dlcdn.apache.org/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
        dest: "/tmp/tomcat.tar.gz"
        mode: "0644"

    - name: Extract Tomcat
      ansible.builtin.unarchive:
        src: "/tmp/tomcat.tar.gz"
        dest: "{{ tomcat_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"

    - name: Set Tomcat ownership
      ansible.builtin.file:
        path: "{{ tomcat_dir }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_user }}"
        recurse: true

    - name: Start Tomcat
      ansible.builtin.command:
        cmd: "{{ tomcat_dir }}/bin/startup.sh"
      become_user: "{{ tomcat_user }}"